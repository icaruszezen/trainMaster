# trainMaster 默认部署：PostgreSQL + 应用（前端已打包进应用镜像），可选训练节点。
#
#   cp .env.example .env      # 按需修改
#   make setup                # 可选：检测本机显卡、驱动与 Docker 的 GPU 支持，启用训练节点（写入 .env）
#   docker compose up -d --build
#   （或直接 make up：先执行 make setup，再构建并启动）
#
# 所有持久化数据都绑定挂载到宿主机目录（默认 ./data/ 下），便于直接备份与迁移：
#   ./data/storage   图片、数据集、模型等文件 → 容器内 /data
#   ./data/postgres  PostgreSQL 数据目录
#   ./data/trainer   训练节点的状态（节点标识等）→ trainer 容器内 /var/lib/trainmaster
# 变量含义见 .env.example；未设置时使用下面 ${VAR:-默认值} 中的默认值。
#
# 训练节点按 compose profile 启用（make setup 把结果写入 .env 的 COMPOSE_PROFILES）：
#   gpu  → trainer      使用全部 NVIDIA 显卡（需要 NVIDIA 驱动与 NVIDIA Container Toolkit）
#   cpu  → trainer-cpu  没有可用的显卡时用 CPU 训练
# 没有设置 COMPOSE_PROFILES 时只运行 postgres 与 app。

name: trainmaster

# 容器日志按大小轮转（每个容器最多约 50MB），避免长期运行后写满磁盘。
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# 训练节点（GPU / CPU 两个服务共用的配置）。镜像按 PyTorch 变体（TM_TORCH_VARIANT，由 make setup
# 按本机驱动与显卡选择）分别打标签，切换变体时不会覆盖另一个变体的镜像。
x-trainer: &trainer
  build:
    context: ./trainer
    args:
      # 基础镜像，可换成内网镜像仓库中的同名镜像
      PYTHON_IMAGE: ${TRAINER_PYTHON_IMAGE:-python:3.12-slim-bookworm}
      # Debian 软件源（安装 OpenCV 依赖的系统库），留空使用官方源
      DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      TORCH_VARIANT: ${TM_TORCH_VARIANT:-cu130}
      # PyTorch 官方索引的镜像（PEP 503，自动拼接 /<变体>）或扁平目录镜像（如阿里云 pytorch-wheels）
      TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
      TORCH_FIND_LINKS: ${TORCH_FIND_LINKS:-}
  image: trainmaster-trainer:${TM_IMAGE_TAG:-latest}-${TM_TORCH_VARIANT:-cu130}
  restart: unless-stopped
  logging: *logging
  # 由 init 进程回收训练与检测子进程
  init: true
  environment:
    # 平台地址：同一台机器上为 compose 网络中的 app；其它机器上的训练节点改为平台的地址
    TM_SERVER_URL: ${TM_SERVER_URL:-http://app:8080}
    # 与 app 的 TM_NODE_TOKEN 相同（make setup 自动生成）
    TM_NODE_TOKEN: ${TM_NODE_TOKEN:-}
    # 节点名称，留空时使用容器的主机名（make setup 写入宿主机的主机名）
    TM_NODE_NAME: ${TM_NODE_NAME:-}
    TM_DATA_DIR: /data
    TM_LOG_LEVEL: ${TM_LOG_LEVEL:-info}
    # 容器以 root 启动，修正状态目录属主后以 PUID:PGID 运行（与 app 相同，才能读写 /data 中的文件）
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-Asia/Shanghai}
  volumes:
    # 与 app 共用存储目录：读取数据集、写入运行产物与模型权重
    - ${TM_HOST_STORAGE_DIR:-./data/storage}:/data
    # 节点标识（node-key）、心跳文件等状态，重建容器后节点不变
    - ${TM_HOST_TRAINER_DIR:-./data/trainer}:/var/lib/trainmaster
  # PyTorch DataLoader 多进程通过 /dev/shm 传递数据，Docker 默认的 64MB 不够用
  shm_size: ${TM_TRAINER_SHM_SIZE:-8gb}
  # 训练节点收到 SIGTERM 后结束正在运行的检测子进程再退出
  stop_grace_period: 30s

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${TM_DB_USER:-trainmaster}
      POSTGRES_PASSWORD: ${TM_DB_PASSWORD:-trainmaster}
      POSTGRES_DB: ${TM_DB_NAME:-trainmaster}
      # 使用 PostgreSQL 内置的排序规则（不依赖镜像的 libc），数据目录可以在
      # alpine 与 Debian 版 postgres 镜像之间直接切换。只在首次初始化时生效。
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${TM_HOST_POSTGRES_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 默认不对外暴露端口；本地开发需要时叠加 docker-compose.dev.yml。

  app:
    build:
      context: .
      args:
        # 基础镜像，可换成内网镜像仓库中的同名镜像
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        GO_IMAGE: ${GO_IMAGE:-golang:1.24-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.23}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        # 版本信息，留空则使用源码默认值（make up 会自动填入 git 提交号与构建时间）
        VERSION: ${TM_VERSION:-}
        COMMIT: ${TM_COMMIT:-}
        BUILD_TIME: ${TM_BUILD_TIME:-}
    image: trainmaster:${TM_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TM_HTTP_PORT:-8080}:8080"
    environment:
      TM_DB_HOST: postgres
      TM_DB_PORT: "5432"
      TM_DB_USER: ${TM_DB_USER:-trainmaster}
      TM_DB_PASSWORD: ${TM_DB_PASSWORD:-trainmaster}
      TM_DB_NAME: ${TM_DB_NAME:-trainmaster}
      TM_LOG_LEVEL: ${TM_LOG_LEVEL:-info}
      TM_LOG_FORMAT: json
      TM_TRUSTED_PROXIES: ${TM_TRUSTED_PROXIES:-}
      # 训练节点注册 / 心跳时必须携带的令牌（make setup 自动生成）；留空则不校验
      TM_NODE_TOKEN: ${TM_NODE_TOKEN:-}
      # 训练节点的心跳间隔，留空为 10s
      TM_NODE_HEARTBEAT_INTERVAL: ${TM_NODE_HEARTBEAT_INTERVAL:-}
      # 容器以 root 启动，修正 /data 目录属主后以 PUID:PGID 运行服务
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 图片等文件数据直接保存在宿主机本地目录
      - ${TM_HOST_STORAGE_DIR:-./data/storage}:/data
    # 应用的优雅关闭超时为 15s
    stop_grace_period: 20s

  # GPU 训练节点：COMPOSE_PROFILES=gpu。不依赖 app（depends_on），其它 GPU 机器上可以只运行它：
  #   docker compose up -d --build trainer
  # 节点连不上平台时自己重试。只使用部分显卡见 docs/deployment.md 第 10.8 节（docker-compose.override.yml 中的 device_ids）。
  trainer:
    <<: *trainer
    profiles: [gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # CPU 训练节点：没有可用的 NVIDIA 显卡（或 Docker 无法使用显卡）时，COMPOSE_PROFILES=cpu。
  trainer-cpu:
    <<: *trainer
    profiles: [cpu]
